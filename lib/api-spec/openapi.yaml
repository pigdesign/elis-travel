          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBookingParticipantReplaceInput"
      responses:
        "200":
          description: Partecipanti completi o replay idempotente degli stessi dati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBookingParticipantReplaceResponse"
        "400":
          description: Numero, tipi, nominativi o assegnazioni non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
