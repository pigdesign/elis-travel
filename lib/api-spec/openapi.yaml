          type: string
          enum: [bank_transfer, office]
          nullable: true
          description: Obbligatorio salvo prenotazione gratuita, che non ha metodo di pagamento
        paymentDeadline:
          type: string
          format: date-time
          nullable: true
          description: Obbligatoria per deposit_requested e full_requested e strettamente precedente alla partenza
        transactionReference:
          type: string
          nullable: true
          maxLength: 500
          description: CRO/TRN o riferimento ricevuta/cassa, obbligatorio per deposit e paid salvo prenotazione gratuita
