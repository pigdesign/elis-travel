  /admin/terms-version:
    get:
      operationId: getTermsVersion
      tags: [admin]
      summary: Versione dei Termini e Condizioni pubblicata su Iubenda
      description: >
        Data di ultima modifica del documento Iubenda, usata come versione dei
        consensi. Con refresh=1 la cache viene svuotata e il documento riletto:
        da usare subito dopo aver pubblicato una modifica su Iubenda.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: refresh
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Se "1", rilegge il documento ignorando la cache.
      responses:
        "200":
          description: Versione in vigore
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                    nullable: true
                    description: >
                      Data di ultima modifica, es. "19 agosto 2026". null se
                      Iubenda non e raggiungibile e non esiste alcun valore noto.
