openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autenticazione admin
  - name: excursions
    description: Gite di gruppo
  - name: offers
    description: Offerte e pacchetti viaggio
  - name: leads
    description: Richieste clienti (Mini-CRM)
  - name: public
    description: Endpoint pubblici (senza autenticazione)
  - name: dashboard
    description: Dashboard amministrativa
  - name: customers
    description: Anagrafica clienti e integrazione RivieraTransferRMS
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Credenziali non valide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Logout admin
      responses:
        "200":
          description: Logout riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Utente corrente
      responses:
        "200":
          description: Dati utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: Lista clienti locali con stato collegamento RMS (paginata)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Ricerca per nome o email
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Pagina (default 1)
      responses:
        "200":
          description: Lista clienti paginata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListPage"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Crea nuovo cliente locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Cliente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/rms/import:
    post:
      operationId: importCustomerFromRms
      tags: [customers]
      summary: Importa un cliente da RMS come profilo locale (crea + collega automaticamente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRmsImportInput"
      responses:
        "201":
          description: Cliente importato (creato o deduplicato per email) e collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/rms/search:
    get:
      operationId: searchRmsCustomers
      tags: [customers]
      summary: Cerca clienti nel CRM RivieraTransferRMS
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Testo di ricerca (min 2 caratteri)
      responses:
        "200":
          description: Risultati ricerca RMS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RmsSearchResult"
        "400":
          description: Query troppo corta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Errore comunicazione con RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Dettaglio cliente con link RMS e timeline sync
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dettaglio cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Aggiorna cliente (avvia sync RMS in background se collegato)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Cliente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Elimina cliente da ElisTravel (non tocca RMS)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cliente eliminato
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}/link:
    post:
      operationId: linkCustomerToRms
      tags: [customers]
      summary: Collega cliente locale a un profilo RMS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRmsLinkInput"
      responses:
        "200":
          description: Cliente collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}/pull:
    post:
      operationId: pullCustomerFromRms
      tags: [customers]
      summary: Scarica aggiornamenti da RMS per un cliente collegato (sovrascrive dati locali)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sincronizzazione completata e dati aggiornati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "400":
          description: Cliente non ancora collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Errore di comunicazione con RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}/sync:
    post:
      operationId: syncCustomerToRms
      tags: [customers]
      summary: Avvia sincronizzazione del cliente verso RMS (fire-and-forget)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Sincronizzazione avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Cliente non ancora collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Statistiche dashboard admin
      responses:
        "200":
          description: Statistiche aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /admin/excursions:
    get:
      operationId: listExcursions
      tags: [excursions]
      summary: Lista gite
      responses:
        "200":
          description: Lista gite con dati finanziari
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExcursionSummary"
    post:
      operationId: createExcursion
      tags: [excursions]
      summary: Crea nuova gita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionInput"
      responses:
        "201":
          description: Gita creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
  /admin/excursions/{id}:
    get:
      operationId: getExcursion
      tags: [excursions]
      summary: Dettaglio gita con prenotazioni
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dettaglio gita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionDetail"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateExcursion
      tags: [excursions]
      summary: Aggiorna gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionInput"
      responses:
        "200":
          description: Gita aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
    delete:
      operationId: deleteExcursion
      tags: [excursions]
      summary: Elimina gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gita eliminata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Gita con prenotazioni esistenti, impossibile eliminare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/bookings:
    post:
      operationId: addExcursionBooking
      tags: [excursions]
      summary: Aggiungi prenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Prenotazione aggiunta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /admin/excursions/{id}/bookings/{bookingId}:
    patch:
      operationId: updateExcursionBookingPayment
      tags: [excursions]
      summary: Aggiorna stato pagamento prenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingPaymentStatusUpdate"
      responses:
        "200":
          description: Prenotazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteExcursionBooking
      tags: [excursions]
      summary: Elimina prenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prenotazione eliminata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /excursions/{id}/book:
    post:
      operationId: createPublicExcursionBooking
      tags: [public]
      summary: Prenota un posto su una gita (pubblico, senza autenticazione)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingInput"
      responses:
        "201":
          description: Prenotazione registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingResponse"
        "400":
          description: Dati non validi o posti esauriti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /excursions/{id}/book/{bookingId}/card-confirmed:
    post:
      operationId: confirmPublicExcursionBookingCard
      tags: [public]
      summary: Conferma carta salvata dopo SetupIntent (chiamato dopo 3DS)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardConfirmedInput"
      responses:
        "200":
          description: Carta confermata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardConfirmedResponse"
        "400":
          description: Errore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/vehicle:
    patch:
      operationId: updateExcursionVehicle
      tags: [excursions]
      summary: Cambia veicolo gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdateInput"
      responses:
        "200":
          description: Veicolo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
  /admin/pickup-locations:
    get:
      operationId: listPickupLocations
      tags: [excursions]
      summary: Lista punti di raccolta
      responses:
        "200":
          description: Lista punti di raccolta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupLocation"
    post:
      operationId: createPickupLocation
      tags: [excursions]
      summary: Crea punto di raccolta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupLocationInput"
      responses:
        "201":
          description: Punto di raccolta creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupLocation"
  /admin/pickup-locations/{id}:
    patch:
      operationId: updatePickupLocation
      tags: [excursions]
      summary: Aggiorna punto di raccolta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupLocationInput"
      responses:
        "200":
          description: Punto di raccolta aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupLocation"
        "404":
          description: Non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePickupLocation
      tags: [excursions]
      summary: Elimina punto di raccolta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Eliminato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "409":
          description: In uso in una o più gite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/pickup-points:
    get:
      operationId: listExcursionPickupPoints
      tags: [excursions]
      summary: Lista punti di raccolta di una gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista pickup points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExcursionPickupPoint"
    post:
      operationId: addExcursionPickupPoint
      tags: [excursions]
      summary: Aggiungi punto di raccolta a gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionPickupPointInput"
      responses:
        "201":
          description: Punto aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionPickupPoint"
  /admin/excursions/{id}/pickup-points/{ppId}:
    patch:
      operationId: updateExcursionPickupPoint
      tags: [excursions]
      summary: Aggiorna orario punto di raccolta
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ppId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionPickupPointUpdate"
      responses:
        "200":
          description: Aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionPickupPoint"
    delete:
      operationId: deleteExcursionPickupPoint
      tags: [excursions]
      summary: Rimuovi punto di raccolta da gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ppId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rimosso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /admin/vehicles:
    get:
      operationId: listVehicles
      tags: [excursions]
      summary: Lista veicoli disponibili
      responses:
        "200":
          description: Lista veicoli
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [excursions]
      summary: Crea un nuovo mezzo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Mezzo creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/vehicles/{id}:
    patch:
      operationId: updateVehicle
      tags: [excursions]
      summary: Modifica un mezzo esistente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "200":
          description: Mezzo aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mezzo non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVehicle
      tags: [excursions]
      summary: Elimina un mezzo non collegato a gite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Mezzo eliminato
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
        "404":
          description: Mezzo non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mezzo collegato a una o più gite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: Lista offerte
      responses:
        "200":
          description: Lista offerte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferSummary"
    post:
      operationId: createOffer
      tags: [offers]
      summary: Crea nuova offerta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: Offerta creata
          content:
            application/json:
              schema:
