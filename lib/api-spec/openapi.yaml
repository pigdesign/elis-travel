  /admin/bookings/{bookingId}/profile:
    patch:
      operationId: updateAdminBookingProfile
      tags: [excursions]
      summary: Corregge i dati del referente e il totale della prenotazione
      description: >-
        Anagrafica e totale sono modificabili anche a pagamento avvenuto: un
        recapito sbagliato va corretto proprio quando la gita è vicina. Il
        totale non può scendere sotto l'importo già incassato, e cambiandolo le
        richieste ancora aperte vengono riallineate al nuovo residuo.
      security:
        - cookieAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBookingProfileInput"
      responses:
        "200":
          description: Prenotazione aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Dati del referente o totale non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Prenotazione annullata o totale sotto l'incassato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/payment-requests/{requestId}:
    patch:
      operationId: updateAdminPaymentRequest
      tags: [excursions]
      summary: Corregge metodo, importo o scadenza di una richiesta ancora aperta
      description: >-
        È il percorso con cui l'ufficio decide al posto del cliente che non usa
        il portale. La carta resta esclusa: autorizzare un addebito richiede il
        consenso del titolare. Il saldo a bordo resta ammesso solo per le
        richieste di tipo balance su gite che lo abilitano, e sposta scadenza e
        tolleranza alla partenza. Una richiesta scaduta torna esigibile.
      security:
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPaymentRequestPatchInput"
      responses:
        "200":
          description: Richiesta aggiornata
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  unchanged:
                    type: boolean
                  reopened:
                    type: boolean
                required: [ok, unchanged, reopened]
        "400":
          description: Metodo, importo o scadenza non ammessi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Richiesta non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Richiesta già chiusa, prenotazione annullata o gita conclusa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/bookings/{bookingId}/payments:
    post:
      operationId: recordAdminBookingPayment
      tags: [excursions]
      summary: Registra un incasso arrivato in ufficio
      description: >-
        Copre i casi che "segna pagato" non raggiunge: prenotazioni storiche
        senza richieste di pagamento e versamenti che non coincidono con
        l'importo richiesto. Se una richiesta aperta ha esattamente
        quell'importo viene saldata quella, altrimenti nasce una richiesta già
        incassata. Dopo il movimento le richieste ancora aperte vengono
        riallineate al residuo.
      security:
        - cookieAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBookingPaymentInput"
      responses:
        "201":
          description: Incasso registrato
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  paymentRequestId:
                    type: string
                    format: uuid
                  amountPaidCents:
                    type: integer
                required: [ok, paymentRequestId, amountPaidCents]
        "400":
          description: Importo, metodo o riferimento non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Prenotazione annullata, gita chiusa o totale mancante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/payment-requests/{requestId}/reverse:
    post:
      operationId: reverseAdminPaymentRequest
      tags: [excursions]
      summary: Storna un incasso registrato a mano per errore
      description: >-
        Vale solo per gli incassi registrati dall'amministrazione (bonifico,
        ufficio, a bordo). Un incasso su carta non si storna: quel denaro è
        uscito davvero dal conto del cliente e va restituito dal flusso
        rimborsi. Il motivo è obbligatorio e resta nel diario.
      security:
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
              required: [reason]
      responses:
        "200":
          description: Incasso stornato
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  amountPaidCents:
                    type: integer
                required: [ok, amountPaidCents]
        "400":
          description: Motivo mancante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Richiesta non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Richiesta non incassata o incasso su carta da rimborsare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/bookings/{bookingId}/participants:
