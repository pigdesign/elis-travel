openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Autenticazione admin
  - name: excursions
    description: Gite di gruppo
  - name: offers
    description: Offerte e pacchetti viaggio
  - name: leads
    description: Richieste clienti (Mini-CRM)
  - name: public
    description: Endpoint pubblici (senza autenticazione)
  - name: dashboard
    description: Dashboard amministrativa
  - name: customers
    description: Anagrafica clienti e integrazione RivieraTransferRMS
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Credenziali non valide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Logout admin
      responses:
        "200":
          description: Logout riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Utente corrente
      responses:
        "200":
          description: Dati utente autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Non autenticato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: Lista clienti locali con stato collegamento RMS (paginata)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Ricerca per nome o email
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Pagina (default 1)
      responses:
        "200":
          description: Lista clienti paginata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListPage"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Crea nuovo cliente locale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Cliente creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/rms/import:
    post:
      operationId: importCustomerFromRms
      tags: [customers]
      summary: Importa un cliente da RMS come profilo locale (crea + collega automaticamente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRmsImportInput"
      responses:
        "201":
          description: Cliente importato (creato o deduplicato per email) e collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/rms/search:
    get:
      operationId: searchRmsCustomers
      tags: [customers]
      summary: Cerca clienti nel CRM RivieraTransferRMS
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Testo di ricerca (min 2 caratteri)
      responses:
        "200":
          description: Risultati ricerca RMS
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RmsSearchResult"
        "400":
          description: Query troppo corta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Errore comunicazione con RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Dettaglio cliente con link RMS e timeline sync
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dettaglio cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Aggiorna cliente (avvia sync RMS in background se collegato)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Cliente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Elimina cliente da ElisTravel (non tocca RMS)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Cliente eliminato
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}/link:
    post:
      operationId: linkCustomerToRms
      tags: [customers]
      summary: Collega cliente locale a un profilo RMS
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRmsLinkInput"
      responses:
        "200":
          description: Cliente collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}/pull:
    post:
      operationId: pullCustomerFromRms
      tags: [customers]
      summary: Scarica aggiornamenti da RMS per un cliente collegato (sovrascrive dati locali)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sincronizzazione completata e dati aggiornati
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSummary"
        "400":
          description: Cliente non ancora collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Errore di comunicazione con RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}/sync:
    post:
      operationId: syncCustomerToRms
      tags: [customers]
      summary: Avvia sincronizzazione del cliente verso RMS (fire-and-forget)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Sincronizzazione avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Cliente non ancora collegato a RMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cliente non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Statistiche dashboard admin
      responses:
        "200":
          description: Statistiche aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /admin/excursions:
    get:
      operationId: listExcursions
      tags: [excursions]
      summary: Lista gite
      responses:
        "200":
          description: Lista gite con dati finanziari
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExcursionSummary"
    post:
      operationId: createExcursion
      tags: [excursions]
      summary: Crea nuova gita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionCreateInput"
      responses:
        "201":
          description: Gita creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
  /admin/excursions/{id}:
    get:
      operationId: getExcursion
      tags: [excursions]
      summary: Dettaglio gita con prenotazioni
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dettaglio gita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionDetail"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateExcursion
      tags: [excursions]
      summary: Aggiorna gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionInput"
      responses:
        "200":
          description: Gita aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
        "409":
          description: Capienza inferiore ai posti occupati o attività amministrative aperte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteExcursion
      tags: [excursions]
      summary: Elimina gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gita eliminata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Gita con prenotazioni esistenti, impossibile eliminare
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/bookings:
    post:
      operationId: addExcursionBooking
      tags: [excursions]
      summary: Aggiungi prenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "200":
          description: Replay idempotente di una prenotazione già creata dallo stesso comando
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "201":
          description: Prenotazione aggiunta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Referente o partecipanti non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Gita non prenotabile, posti insufficienti o comando riutilizzato con dati diversi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Impossibile allocare temporaneamente un codice prenotazione univoco; retry sicuro con lo stesso clientCommandId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/bookings/{bookingId}:
    delete:
      operationId: deleteExcursionBooking
      tags: [excursions]
      summary: Elimina prenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prenotazione eliminata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /excursions/{id}/book:
    post:
      operationId: createPublicExcursionBooking
      tags: [public]
      summary: Prenota un posto su una gita (pubblico, senza autenticazione)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingInput"
      responses:
        "200":
          description: Replay idempotente della stessa prenotazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingResponse"
        "201":
          description: Prenotazione registrata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingResponse"
        "400":
          description: Dati non validi o posti esauriti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Preventivo cambiato, stato concorrente o flusso carta non più autorizzato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /excursions/{id}/book/{bookingId}/payment-confirmed:
    post:
      operationId: confirmPublicExcursionBookingPayment
      tags: [public]
      summary: Conferma il PaymentIntent dopo stripe.confirmPayment (idempotente col webhook)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentIntentId:
                  type: string
              required: [paymentIntentId]
      responses:
        "200":
          description: Pagamento confermato
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Errore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Pagamento ricevuto ma destinato al rimborso o non ancora riconciliato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /excursions/{id}/book/{bookingId}/card-setup-confirmed:
    post:
      operationId: confirmPublicExcursionBookingCardSetup
      tags: [public]
      summary: Conferma in sicurezza il SetupIntent per l'acconto alla conferma della gita
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardConfirmedInput"
      responses:
        "200":
          description: Carta salvata; nessun addebito ancora eseguito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardConfirmedResponse"
        "400":
          description: SetupIntent non valido o non corrispondente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Prenotazione non piu in attesa del salvataggio carta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /excursions/{id}/book/{bookingId}/card-confirmed:
    post:
      operationId: confirmPublicExcursionBookingCard
      tags: [public]
      summary: Conferma carta salvata dopo SetupIntent (endpoint legacy protetto)
      deprecated: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardConfirmedInput"
      responses:
        "200":
          description: Carta confermata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardConfirmedResponse"
        "400":
          description: Errore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Prenotazione non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/age-prices:
    get:
      operationId: listExcursionAgePrices
      tags: [excursions]
      summary: Prezzi per fascia età della gita (fasce attive)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prezzi per fascia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExcursionAgePriceRow"
    put:
      operationId: updateExcursionAgePrices
      tags: [excursions]
      summary: Aggiorna i prezzi per fascia età della gita
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExcursionAgePricesInput"
      responses:
        "200":
          description: Prezzi aggiornati
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/pickup-report:
    get:
      operationId: getExcursionPickupReport
      tags: [excursions]
      summary: Report raccolta bus per punto (persone, tipi, nominativi)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Report raccolta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupReport"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/confirm-trip:
    post:
      operationId: confirmTrip
      tags: [excursions]
      summary: Conferma la gita e genera le richieste saldo (idempotente)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gita confermata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmTripResponse"
        "400":
          description: Stato non confermabile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Partenza già avvenuta oppure conferma superata da un cambio di stato concorrente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/complete-trip:
    post:
      operationId: completeExcursionTrip
      tags: [excursions]
      summary: Completa amministrativamente una gita dopo i controlli finali
      description: Comando idempotente; accetta una gita confermata già partita e blocca la chiusura se restano attività economiche, anagrafiche o Stripe aperte.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gita completata o già completata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stato, partenza o attività amministrative impediscono il completamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/cancel-trip:
    post:
      operationId: cancelExcursionTrip
      tags: [excursions]
      summary: Annulla una gita tramite il workflow finanziario dedicato
      description: Libera i posti e pianifica rimborsi o attività manuali senza passare dal PATCH generico.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Gita annullata o replay idempotente del comando
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcursionSummary"
        "404":
          description: Gita non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stato o attività finanziaria in conflitto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/excursions/{id}/expire-overdue:
    post:
      operationId: expireOverdueBookings
      tags: [excursions]
      summary: Marca scadute le prenotazioni oltre scadenza (liberando i posti solo se richiesto)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                releaseSeats:
                  type: boolean
      responses:
        "200":
          description: Prenotazioni scadute aggiornate
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  expired:
                    type: integer
                  releasedSeats:
                    type: integer
                  requiresCancellationDecision:
                    type: integer
                    description: Prenotazioni scadute con fondi o riferimenti finanziari che richiedono una decisione amministrativa prima di liberare i posti
                  stripeCancellationsScheduled:
                    type: integer
                    description: Operazioni di cleanup Stripe pianificate dalla verifica
                required:
                  [
                    ok,
                    expired,
                    releasedSeats,
                    requiresCancellationDecision,
                    stripeCancellationsScheduled,
                  ]
  /admin/payment-requests/{requestId}/mark-paid:
    post:
      operationId: markPaymentRequestPaid
      tags: [excursions]
      summary: Conferma manuale di una richiesta di pagamento (bonifico/ufficio)
      security:
        - cookieAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionReference:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: CRO/TRN del bonifico oppure riferimento univoco della ricevuta/cassa
              required: [transactionReference]
      responses:
        "200":
          description: Pagamento registrato
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  alreadyApplied:
                    type: boolean
                required: [ok, alreadyApplied]
        "404":
          description: Richiesta non trovata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Metodo non confermabile manualmente, posti non disponibili o replay con riferimento diverso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/bookings/{bookingId}/request-balance:
    post:
      operationId: requestBookingBalance
      tags: [excursions]
      summary: Crea la richiesta saldo per una prenotazione (idempotente)
      security:
        - cookieAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Richiesta creata o già esistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  outcome:
                    type: string
                required: [ok, outcome]
        "400":
          description: Nessun residuo da richiedere
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Gita non confermata, già partita o prenotazione con annullamento in corso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/bookings/{bookingId}/deadline:
