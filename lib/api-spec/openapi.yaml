          enum: [deposit_requested, full_requested, deposit, paid]
          description: Per una gita già confermata sono ammessi soltanto full_requested e paid
        totalAmountCents:
          type: integer
          minimum: 0
          description: Con valore zero la prenotazione deve essere paid ed è registrata come gratuita senza movimento di pagamento
