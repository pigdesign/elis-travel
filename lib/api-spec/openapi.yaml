components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
      required:
        - id
        - email
        - name
        - role
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error
    ExcursionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subtitle:
          type: string
          nullable: true
          description: Riga di richiamo sotto il titolo (locandina e sito)
        location:
          type: string
        date:
          type: string
        departureAt:
          type: string
          format: date-time
          nullable: true
          description: Istante di partenza; visualizzato e inserito nel fuso Europe/Rome
        status:
          type: string
          enum: [draft, open, confirmed, completed, cancelled, archived]
        category:
          type: string
          enum: [standard, rident]
        tags:
          type: array
          items:
            type: string
        currentCapacity:
          type: integer
        minThreshold:
          type: integer
        adherentsCount:
          type: integer
        depositsCount:
          type: integer
        balancesCount:
          type: integer
        pendingRequestsCount:
          type: integer
        vehicleFixedCost:
          type: string
        mealCostPerPerson:
          type: string
        entranceCostPerPerson:
          type: string
        extraCostPerPerson:
          type: string
        extras:
          type: array
          items:
            $ref: "#/components/schemas/ExcursionExtra"
        otherCosts:
          type: array
          items:
            $ref: "#/components/schemas/ExcursionExtra"
        otherCostsTotal:
          type: string
        pricePerPerson:
          type: string
        provinceSurcharges:
          type: object
          additionalProperties:
            type: number
        vehicleId:
          type: string
          nullable: true
        switchThreshold:
          type: integer
          nullable: true
        switchVehicleId:
          type: string
          nullable: true
        switchVehicleAdditionalCost:
          type: string
          nullable: true
        operationalNotes:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        schedule:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ScheduleDay"
        included:
          type: string
          nullable: true
        excluded:
          type: string
          nullable: true
        generalInfo:
          type: string
          nullable: true
        ricaviStimati:
          type: number
        costiVariabili:
          type: number
        costiTotali:
          type: number
        margineNetto:
          type: number
        patientPrice:
          type: string
          nullable: true
        companionPrice:
          type: string
          nullable: true
        returnDate:
          type: string
          nullable: true
        bookingCloseDate:
          type: string
          nullable: true
        depositEnabled:
          type: boolean
        depositType:
          type: string
        depositValue:
          type: string
          nullable: true
        depositAvailableAfterConfirm:
          type: boolean
        depositDeadlineDate:
          type: string
          nullable: true
        balanceDeadlineDate:
          type: string
          nullable: true
        balanceHoursOverride:
          type: integer
          nullable: true
        payCardEnabled:
          type: boolean
        payBankTransferEnabled:
          type: boolean
        payOfficeEnabled:
          type: boolean
        payOnBusEnabled:
          type: boolean
        bankTransferHoursOverride:
          type: integer
          nullable: true
        officeHoursOverride:
          type: integer
          nullable: true
        fullPaymentOnlyDaysBefore:
          type: integer
          nullable: true
        waitlistEnabled:
          type: boolean
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - location
        - date
        - status
        - category
        - currentCapacity
        - minThreshold
        - adherentsCount
        - depositsCount
        - balancesCount
        - pendingRequestsCount
        - pricePerPerson
        - extras
        - otherCosts
        - ricaviStimati
        - costiVariabili
        - costiTotali
        - margineNetto
        - createdAt
        - updatedAt
    ExcursionDetail:
      allOf:
        - $ref: "#/components/schemas/ExcursionSummary"
        - type: object
          properties:
            bookings:
              type: array
              items:
                $ref: "#/components/schemas/Booking"
          required:
            - bookings
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        excursionId:
          type: string
          format: uuid
        customerId:
          type: string
          nullable: true
        customerName:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        seats:
          type: integer
        adults:
          type: integer
        children:
          type: integer
        paymentStatus:
          type: string
        bookedAt:
          type: string
          format: date-time
        servizioCasa:
          type: boolean
          nullable: true
        homePickupAddress:
          type: string
          nullable: true
          maxLength: 500
          description: Snapshot dell'indirizzo indicato per il ritiro a domicilio
        pickupPointId:
          type: string
          format: uuid
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        bookingCode:
          type: string
          nullable: true
        paymentType:
          type: string
