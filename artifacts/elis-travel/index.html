    <style>
    /* ── Loader overlay ── */
    #elistravel-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    #elistravel-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    /* ── Contenitore logo ── */
    #elistravel-loader .logo-wrap {
      position: relative;
      width: 480px;
      max-width: 88vw;
    }
    #elistravel-loader .logo-svg {
      display: block;
      width: 100%;
      overflow: visible;
    }
    
    /* ── Aereo: animato via JS ── */
    #elistravel-loader .airplane-group {
      will-change: transform, filter;
      transform-box: fill-box;
      transform-origin: center;
    }
    #elistravel-loader .airplane-group.hovering {
      will-change: auto;
      animation: plane-hover 4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes plane-hover {
      0%,100% { transform: translate(0,0)      rotate(0deg);    }
      35%     { transform: translate(2px,-4px) rotate(-1.5deg); }
      70%     { transform: translate(3px,2px)  rotate(1deg);    }
    }
    
    /* ── Comparsa progressiva del logo ── */
    #elistravel-loader .letters-group  { opacity: 0; animation: et-reveal 0.38s cubic-bezier(0.22,1,0.36,1) 1.20s forwards; }
    #elistravel-loader .travel-group   { opacity: 0; animation: et-reveal 0.24s cubic-bezier(0.22,1,0.36,1) 1.58s forwards; }
    #elistravel-loader .birds-group    { opacity: 0; animation: et-reveal 0.22s cubic-bezier(0.22,1,0.36,1) 1.64s forwards; }
    #elistravel-loader .subtitle-group { opacity: 0; animation: et-reveal 0.30s cubic-bezier(0.22,1,0.36,1) 1.83s forwards; }
    
    @keyframes et-reveal {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    @keyframes et-logo-float {
      0%,100% { transform: translateY(0);   }
      50%     { transform: translateY(-7px);}
    }
    
    /* ── Shimmer sul logo ── */
    #elistravel-loader .shimmer-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #elistravel-loader .shimmer-overlay::after {
      content: '';
      position: absolute;
      top: -20%; left: -60%;
      width: 38%; height: 140%;
      background: linear-gradient(108deg, transparent 30%, rgba(255,255,255,0.62) 50%, transparent 70%);
      opacity: 0;
      animation: et-shimmer-in 0.1s ease 2.2s forwards,
                 et-shimmer    3.2s ease-in-out 2.3s infinite;
    }
    @keyframes et-shimmer-in { to { opacity: 1; } }
    @keyframes et-shimmer    { 0%{transform:translateX(0)} 100%{transform:translateX(520%)} }
    
    
    /* ── Regola per nascondere il loader se non siamo in home-page ── */
    html.not-home #elistravel-loader {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    </style>

    <script>
    if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
    (function () {
      'use strict';
    
      // ── Elementi DOM ──────────────────────────────────────────
      const loader  = document.getElementById('elistravel-loader');
      const plane   = document.querySelector('.airplane-group');
      const logoSvg = document.querySelector('.logo-svg');
    
      // ── Parametri configurabili ───────────────────────────────
      const MIN_MS      = 2500;   // tempo minimo loader visibile (ms)
      const DURATION_MS = 1100;   // durata volo aereo (ms)
      const DELAY_MS    = 100;    // ritardo iniziale prima del volo (ms)
      const SCALE_START = 1.45;   // scala aereo all'ingresso (es. 1.45 = 145%)
      const SCALE_END   = 1.0;    // scala aereo alla posizione finale
      const TRAIL_MAX   = 40;     // lunghezza scia in frame (~0.67s a 60fps)
    
      // ── Traiettoria bezier cubica (offset CSS px dalla posizione naturale) ──
      // P0 = partenza (fuori schermo sinistra-alto)
      // P1 = controllo 1 (direzione quasi orizzontale in uscita)
      // P2 = controllo 2 (fondo della curva, punto più basso)
      // P3 = arrivo (posizione naturale nel logo = 0,0)
      const P0 = [-1400, -50];
      const P1 = [-1000, -52];
      const P2 = [-250,   110];
      const P3 = [0,        0];
    
      // ── Calcoli derivati ──────────────────────────────────────
      const SVG_OFFSET_DEG = Math.atan2(P3[1]-P2[1], P3[0]-P2[0]) * 180 / Math.PI;
    
      function easeOutQuint(t) { return 1 - Math.pow(1-t, 5); }
    
      function bezierPt(t) {
        const u = 1-t;
        return [
          u*u*u*P0[0] + 3*u*u*t*P1[0] + 3*u*t*t*P2[0] + t*t*t*P3[0],
          u*u*u*P0[1] + 3*u*u*t*P1[1] + 3*u*t*t*P2[1] + t*t*t*P3[1]
        ];
      }
    
      function bezierTan(t) {
        const u = 1-t;
        return [
          3*u*u*(P1[0]-P0[0]) + 6*u*t*(P2[0]-P1[0]) + 3*t*t*(P3[0]-P2[0]),
          3*u*u*(P1[1]-P0[1]) + 6*u*t*(P2[1]-P1[1]) + 3*t*t*(P3[1]-P2[1])
        ];
      }
    
      // ── Canvas scia ───────────────────────────────────────────
      const wrap = plane.closest('.logo-wrap');
      const trailCanvas = document.createElement('canvas');
      trailCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;';
      wrap.appendChild(trailCanvas);
      const tCtx = trailCanvas.getContext('2d');
      trailCanvas.width  = wrap.offsetWidth;
      trailCanvas.height = wrap.offsetHeight;
    
      const wrapRect  = wrap.getBoundingClientRect();
      const planeRect = plane.getBoundingClientRect();
      const NAT_CX = planeRect.left + planeRect.width  / 2 - wrapRect.left;
      const NAT_CY = planeRect.top  + planeRect.height / 2 - wrapRect.top;
      const trailPts = [];
    
      // ── Posizione iniziale (aereo fuori schermo) ──────────────
      const [ix, iy]   = bezierPt(0);
      const [idx, idy] = bezierTan(0);
      const initAngle  = Math.atan2(idy, idx) * 180/Math.PI - SVG_OFFSET_DEG;
      plane.style.transform = `translate3d(${ix}px,${iy}px,0) rotate(${initAngle}deg) scale(${SCALE_START})`;
      plane.style.filter    = 'blur(5px)';
    
      // ── Loop animazione ───────────────────────────────────────
      let flyStart = null;
    
      function flyFrame(ts) {
        if (!flyStart) flyStart = ts;
        const rawT   = Math.min((ts - flyStart) / DURATION_MS, 1);
        const easedT = easeOutQuint(rawT);
    
        const [x, y]   = bezierPt(easedT);
        const [dx, dy] = bezierTan(easedT);
        const angle    = Math.atan2(dy, dx) * 180/Math.PI - SVG_OFFSET_DEG;
        const scale    = SCALE_START + (SCALE_END - SCALE_START) * easedT;
        const blurPx   = rawT < 0.4 ? (4 * (1 - rawT/0.4)).toFixed(2) : 0;
    
        plane.style.transform = `translate3d(${x}px,${y}px,0) rotate(${angle}deg) scale(${scale.toFixed(4)})`;
        plane.style.filter    = blurPx > 0.1 ? `blur(${blurPx}px)` : 'none';
    
        // Scia
        trailPts.push([NAT_CX + x, NAT_CY + y]);
        if (trailPts.length > TRAIL_MAX) trailPts.shift();
        tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
        const vis = Math.max(0, Math.pow(1 - rawT/0.82, 2));
        if (trailPts.length >= 2 && vis > 0.01) {
          const n = trailPts.length;
          for (let i = 1; i < n; i++) {
            const seg = i / n;
            tCtx.beginPath();
            tCtx.strokeStyle = `rgba(242,145,3,${(seg*seg*vis*0.55).toFixed(3)})`;
            tCtx.lineWidth   = 1.0 + seg * 4.5;
            tCtx.lineCap     = 'round';
            tCtx.lineJoin    = 'round';
            tCtx.moveTo(trailPts[i-1][0], trailPts[i-1][1]);
            tCtx.lineTo(trailPts[i][0],   trailPts[i][1]);
            tCtx.stroke();
          }
        }
    
        if (rawT < 1) {
          requestAnimationFrame(flyFrame);
        } else {
          tCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);
          plane.style.transform  = '';
          plane.style.filter     = 'none';
          plane.style.willChange = 'auto';
          plane.classList.add('hovering');
          logoSvg.style.animation = 'et-logo-float 4s ease-in-out 0.5s infinite';
        }
      }
    
      setTimeout(() => requestAnimationFrame(flyFrame), DELAY_MS);
    
      // ── Chiusura loader ───────────────────────────────────────
      const pageStart = Date.now();
    
      function hideLoader() {
        const wait = Math.max(0, MIN_MS - (Date.now() - pageStart));
        setTimeout(() => {
          loader.classList.add('hidden');
        }, wait);
      }
    
      if (document.readyState === 'complete') {
        hideLoader();
      } else {
        window.addEventListener('load', hideLoader);
      }
      // Fallback di sicurezza
      setTimeout(() => loader.classList.add('hidden'), 7000);
    
    }());
    }
